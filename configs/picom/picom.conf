# Site OS picom configuration
# Provides window animations, dual kawase blur, and soft shadows matching mockup.html

# Backend
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# Shadows (mockup: box-shadow: 0 6px 22px rgba(0,0,0,.35))
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Window animations & Fading
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;
fade-delta = 8;
fade-exclude = [];

# Blur (mockup: backdrop-filter: blur(8px) saturate(1.1))
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = true;
  background-fixed = false;
};

blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Opacity
inactive-opacity = 0.98;
active-opacity = 1.0;
frame-opacity = 0.94;

opacity-rule = [
  "88:class_g = 'Xfce4-panel'",
  "96:class_g = 'siteos-menu'",
  "96:class_g = 'Siteos-menu.py'",
  "96:class_g = 'Jgmenu'"
];

# Window types
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; opacity = 0.88; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.96; shadow = true; };
  dropdown_menu = { opacity = 0.96; shadow = true; };
  utility = { shadow = true; opacity = 0.98; };
};
